name: Engine and editor
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: 1
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb xauth
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - run: xvfb-run -a ctest --test-dir build --output-on-failure
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Debug --parallel 2
      # Hosted Windows runners do not guarantee an OpenGL 3.3 display driver.
      - run: ctest --test-dir build -C Debug -R "missing_assets|scene_documents|editor_controls" --output-on-failure
