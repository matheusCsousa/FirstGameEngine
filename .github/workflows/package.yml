name: Windows preview package
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release -R "missing_assets|scene_documents|editor_controls|play_session|editor_authoring|asset_pipeline|script_runtime" --output-on-failure
      - run: cpack --config build/CPackConfig.cmake -C Release -B dist
      - uses: actions/upload-artifact@v4
        with:
          name: Fersa-Editor-Windows-x64
          path: dist/*.zip
